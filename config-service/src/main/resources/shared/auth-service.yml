server:
  port: 5000
  servlet:
    session:
      timeout: 1m

encoder:
  sha512:
    salt: ${AUTH_SHA_SALT}

spring:
  security:
    oauth2:
      client:
        registration:
          internal:
            client-id: auth-service
            client-secret: ${AUTH_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server,info_b_s,info_p_s
            provider: apelsin

# Spring Authorization Server: браузерные клиенты (authorization_code + PKCE, public) и
# сервисные клиенты (client_credentials, секреты из *_SERVICE_PASSWORD) собираются в
# ru.pshiblo.auth.config.RegisteredClientsConfig. Здесь — только то, что зависит от окружения.
auth:
  keys:
    path: ${AUTH_KEYS_PATH:./.keys}
  cors:
    # Origin'ы SPA через запятую (env AUTH_CORS_ORIGINS): они ходят в /oauth2/token напрямую.
    allowed-origins: ${AUTH_CORS_ORIGINS:http://localhost:3000,http://localhost:3006}
  clients:
    browser-main:
      access-token-ttl: 12h
    browser-payment:
      access-token-ttl: 30m

---
spring:
  config:
    activate:
      on-profile: docker

auth:
  issuer: ${AUTH_ISSUER:http://login.graduate.pshiblo.xyz}
  clients:
    browser-main:
      redirect-uris: ${URL_LOGIN_MAIN}
    browser-payment:
      redirect-uris: ${URL_LOGIN_PAYMENT}

---
spring:
  config:
    activate:
      on-profile: local

auth:
  issuer: http://localhost:5000
  clients:
    browser-main:
      redirect-uris: http://localhost:3000/login,${URL_LOGIN_MAIN:}
    browser-payment:
      redirect-uris: http://localhost:3006/login,${URL_LOGIN_PAYMENT:}
