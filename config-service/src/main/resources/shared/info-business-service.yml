spring:
  security:
    oauth2:
      client:
        registration:
          internal:
            client-id: info-business-service
            client-secret: ${INFO_BUSINESS_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
            provider: apelsin
  application:
    name: info-business-service

  datasource:
    url: jdbc:postgresql://${IP_DB}:${PORT_DB}/info-business
    username: info-business
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: update


server:
  port: 6005

feign:
  hystrix:
    enabled: true