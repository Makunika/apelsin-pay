spring:
  datasource:
    url: jdbc:postgresql://${IP_DB}:${PORT_DB}/maxbank-users
    username: maxbank-users
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          internal:
            client-id: users-service
            client-secret: ${USERS_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server
            provider: apelsin

server:
  port: 5001

encoder:
  sha512:
    salt: ${AUTH_SHA_SALT}
