spring:
  security:
    oauth2:
      client:
        registration:
          internal:
            client-id: account-business-service
            client-secret: ${ACCOUNT_BUSINESS_SERVICE_PASSWORD}
            authorization-grant-type: client_credentials
            scope: server,info_b_s
            provider: apelsin
  application:
    name: account-business-service

  datasource:
    url: jdbc:postgresql://${IP_DB}:${PORT_DB}/maxbank-transactions
    username: maxbank-transactions
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: update


server:
  port: 6002

feign:
  hystrix:
    enabled: true